<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>反応シャドー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>反応シャドー</h1>
  <div id="status"></div>
  <div id="direction">準備OK</div>
  <div id="time"></div>
  <button id="startButton">スタート</button>

  <fieldset id="settings">
    <legend>設定</legend>
    <label>切り替え間隔（秒）
      <input type="number" id="intervalInput" value="2" min="1" max="4" step="0.5">
    </label>
    <label>動く秒数
      <input type="number" id="workInput" value="30" min="5" max="300">
    </label>
    <label>休む秒数
      <input type="number" id="restInput" value="30" min="5" max="300">
    </label>
    <label>セット数
      <input type="number" id="setsInput" value="5" min="1" max="20">
    </label>
  </fieldset>

  <script src="script.js"></script>
</body>
</html>
